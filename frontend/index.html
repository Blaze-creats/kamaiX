<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamai Passbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --desk: #12181a;
    --paper: #efead9;
    --paper-shadow: #ded6ba;
    --rule: #c9c1a2;
    --ink: #232a26;
    --ink-muted: #6b7169;
    --cover: #1e2d28;
    --cover-soft: #2a3c35;
    --gold: #c79a4b;
    --stamp: #a8362a;
    --credit: #1f4b36;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

  body {
    margin: 0; min-height: 100vh;
    font-family: 'IBM Plex Sans', sans-serif;
    color: var(--ink);
    background: radial-gradient(ellipse at top, #1c2426 0%, var(--desk) 70%);
    display: flex; justify-content: center; padding: 32px 16px;
  }
  .book {
    width: 100%; max-width: 460px;
    background: var(--paper);
    border-radius: 4px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.2);
    overflow: hidden;
    animation: openBook 0.5s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes openBook { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }

  /* Cover / header */
  .cover {
    background: linear-gradient(160deg, var(--cover-soft), var(--cover));
    color: #e9e2c8;
    padding: 26px 24px 22px;
    position: relative;
  }
  .cover::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 10px;
    background: repeating-linear-gradient(90deg, var(--paper) 0 6px, transparent 6px 12px);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { flex-shrink: 0; }
  .brand-name {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 21px;
    letter-spacing: 0.02em; color: var(--gold);
  }
  .brand-sub { font-size: 11px; color: #a9b2a0; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
  .acct-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 22px; }
  .acct-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #8f9a89; margin-bottom: 4px; }
  .acct-no { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #e9e2c8; }
  .balance { font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 600; color: var(--gold); text-align: right; }
  .balance-label { text-align: right; }

  /* Tabs styled as passbook divider tabs */
  .tabs { display: flex; background: var(--paper-shadow); padding: 0 12px; }
  .tab {
    padding: 11px 16px; font-size: 12.5px; letter-spacing: 0.04em; cursor: pointer;
    color: var(--ink-muted); border-bottom: 2px solid transparent; font-weight: 500;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--stamp); background: var(--paper); }

  .content { padding: 4px 22px 24px; min-height: 320px; }

  /* Ledger rows (offers) */
  .entry {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 0; border-bottom: 1px dashed var(--rule);
  }
  .entry:last-child { border-bottom: none; }
  .serial { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-muted); width: 20px; flex-shrink: 0; }
  .entry-body { flex: 1; min-width: 0; }
  .entry-title { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 500; margin: 0 0 3px; line-height: 1.3; }
  .entry-meta { font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
  .entry-right { text-align: right; flex-shrink: 0; }
  .entry-amount { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--credit); font-size: 14px; }

  .stamp-btn {
    margin-top: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em;
    text-transform: uppercase; background: none; border: 1px solid var(--ink); color: var(--ink);
    padding: 5px 10px; border-radius: 3px; cursor: pointer;
  }
  .stamp-btn:hover { background: var(--ink); color: var(--paper); }
  .stamp-btn:disabled { opacity: 0.5; cursor: default; }
  .stamp-btn:disabled:hover { background: none; color: var(--ink); }

  .stamp-mark {
    display: inline-block; margin-top: 6px; font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; color: var(--stamp);
    border: 2px solid var(--stamp); border-radius: 3px; padding: 3px 8px;
    transform: rotate(-6deg); animation: stampDrop 0.35s cubic-bezier(.3,1.6,.5,1) both;
  }
  @keyframes stampDrop {
    0% { opacity: 0; transform: rotate(-6deg) scale(2.4); }
    70% { opacity: 1; }
    100% { opacity: 1; transform: rotate(-6deg) scale(1); }
  }

  .hint { font-size: 11.5px; color: var(--ink-muted); margin: 14px 2px 0; line-height: 1.5; }

  /* Ledger tab */
  .ledger-head { display: flex; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); padding: 10px 0 6px; border-bottom: 1px solid var(--rule); }
  .ledger-row { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--rule); font-size: 13px; }
  .ledger-row:last-child { border-bottom: none; }
  .lc-desc { flex: 1; }
  .lc-amt { width: 90px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
  .lc-amt.debit { color: var(--stamp); }
  .lc-amt.credit { color: var(--credit); }
  .closing { display: flex; justify-content: space-between; margin-top: 14px; padding-top: 14px; border-top: 2px solid var(--ink); font-family: 'IBM Plex Mono', monospace; font-weight: 600; }

  /* Withdraw slip */
  .slip { border: 1.5px dashed var(--ink-muted); border-radius: 4px; padding: 18px; margin-top: 14px; position: relative; }
  .slip::before { content: "WITHDRAWAL SLIP"; position: absolute; top: -9px; left: 14px; background: var(--paper); padding: 0 6px; font-size: 10px; letter-spacing: 0.1em; color: var(--ink-muted); }
  label { display: block; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted); margin: 12px 0 5px; }
  label:first-of-type { margin-top: 4px; }
  input {
    width: 100%; padding: 11px 12px; border: 1px solid var(--rule); border-radius: 3px;
    background: #fbf9f1; color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 14px;
  }
  input:focus { outline: 2px solid var(--cover); outline-offset: 1px; }

  button.primary {
    width: 100%; margin-top: 16px; background: var(--cover); color: #e9e2c8;
    border: none; padding: 13px; border-radius: 3px; font-weight: 600; font-size: 13.5px;
    letter-spacing: 0.03em; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif;
  }
  button.primary:hover { background: var(--cover-soft); }
  button.primary:focus-visible, .stamp-btn:focus-visible, .tab:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }

  .msg { font-size: 12.5px; color: var(--ink-muted); margin-top: 10px; min-height: 16px; }
  .empty { text-align: center; padding: 40px 0; color: var(--ink-muted); font-size: 13px; }

  /* Login screen */
  .login-copy { padding: 6px 2px 4px; }
  .login-copy h2 { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 500; margin: 10px 0 6px; }
  .login-copy p { font-size: 13px; color: var(--ink-muted); margin: 0 0 18px; line-height: 1.5; }
</style>
</head>
<body>
<div class="book" id="app"></div>

<script>
// Point this at your deployed backend URL when you host the frontend as a real website.
const API_BASE = 'https://kamai-passbook.onrender.com';
let state = { token: safeGet('token'), phone: '', tab: 'offers', pending: {} };

function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API_BASE + path, { ...opts, headers });
  return res.json();
}

function brandMark() {
  return `<svg width="26" height="26" viewBox="0 0 26 26" fill="none">
    <rect x="1" y="1" width="24" height="24" rx="3" stroke="#c79a4b" stroke-width="1.4"/>
    <path d="M7 13h12M13 7v12" stroke="#c79a4b" stroke-width="1.4" stroke-linecap="round"/>
  </svg>`;
}

function render() {
  const el = document.getElementById('app');
  if (!state.token) return renderLogin(el);
  renderMain(el);
}

function renderLogin(el) {
  el.innerHTML = `
    <div class="cover">
      <div class="brand">${brandMark()}<div><div class="brand-name">Kamai Passbook</div><div class="brand-sub">Your earnings, entered by hand</div></div></div>
    </div>
    <div class="content">
      <div class="login-copy">
        <h2>Open your passbook</h2>
        <p>Enter your registered mobile number to see your ledger.</p>
      </div>
      <label>Mobile number</label>
      <input id="phone" inputmode="numeric" placeholder="10-digit number" />
      <button class="primary" onclick="sendOtp()">Send verification code</button>
      <div id="otpBox" style="display:none; margin-top:18px;">
        <label>Verification code</label>
        <input id="otp" placeholder="123456 (demo code)" />
        <button class="primary" onclick="verifyOtp()">Open passbook</button>
      </div>
      <p class="msg" id="loginMsg"></p>
    </div>
  `;
}

async function sendOtp() {
  const phone = document.getElementById('phone').value.trim();
  if (phone.length < 10) { document.getElementById('loginMsg').innerText = 'Enter a valid 10-digit number.'; return; }
  state.phone = phone;
  const r = await api('/auth/send-otp', { method: 'POST', body: JSON.stringify({ phone }) });
  document.getElementById('otpBox').style.display = 'block';
  document.getElementById('loginMsg').innerText = r.message || r.error;
}

async function verifyOtp() {
  const otp = document.getElementById('otp').value.trim();
  const r = await api('/auth/verify-otp', { method: 'POST', body: JSON.stringify({ phone: state.phone, otp }) });
  if (r.token) { state.token = r.token; safeSet('token', r.token); render(); }
  else document.getElementById('loginMsg').innerText = r.error;
}

async function renderMain(el) {
  const wallet = await api('/wallet');
  const phone = safeGet('phone') || '••••••••••';
  el.innerHTML = `
    <div class="cover">
      <div class="brand">${brandMark()}<div><div class="brand-name">Kamai Passbook</div><div class="brand-sub">Your earnings, entered by hand</div></div></div>
      <div class="acct-row">
        <div><div class="acct-label">Account holder</div><div class="acct-no">${state.phone || phone}</div></div>
        <div class="balance-label"><div class="acct-label">Balance</div><div class="balance">₹${wallet.balance ?? 0}</div></div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab ${state.tab==='offers'?'active':''}" onclick="setTab('offers')" tabindex="0">Tasks</div>
      <div class="tab ${state.tab==='wallet'?'active':''}" onclick="setTab('wallet')" tabindex="0">Ledger</div>
      <div class="tab ${state.tab==='withdraw'?'active':''}" onclick="setTab('withdraw')" tabindex="0">Withdraw</div>
    </div>
    <div class="content" id="tabContent"></div>
  `;
  if (state.tab === 'offers') renderOffers();
  else if (state.tab === 'wallet') renderWallet(wallet);
  else renderWithdraw(wallet);
}

function setTab(t) { state.tab = t; render(); }

async function renderOffers() {
  const { offers } = await api('/offers');
  const box = document.getElementById('tabContent');
  box.innerHTML = offers.map((o, i) => `
    <div class="entry">
      <div class="serial">${String(i+1).padStart(2,'0')}</div>
      <div class="entry-body">
        <p class="entry-title">${o.title}</p>
        <div class="entry-meta">${o.category}</div>
        <div id="action-${o.id}">
          <button class="stamp-btn" onclick="doOffer('${o.id}')">Mark done</button>
        </div>
      </div>
      <div class="entry-right"><div class="entry-amount">+₹${o.reward}</div></div>
    </div>
  `).join('');
  box.innerHTML += `<p class="hint">Marking a task done records it as pending. It's confirmed — and credited — only once the task network verifies it, same as a real bank clears a deposit before it's spendable.</p>`;
}

async function doOffer(offerId) {
  const actionBox = document.getElementById(`action-${offerId}`);
  actionBox.innerHTML = `<span class="entry-meta">Pending confirmation…</span>`;
  const r = await api(`/offers/${offerId}/complete`, { method: 'POST' });
  if (r.error) { actionBox.innerHTML = `<span class="entry-meta">${r.error}</span>`; return; }
  setTimeout(async () => {
    await api('/webhook/postback-simulate', {
      method: 'POST',
      body: JSON.stringify({ completionId: r.completion.id, result: 'confirmed' }),
    });
    actionBox.innerHTML = `<span class="stamp-mark">✓ Confirmed</span>`;
  }, 1400);
}

function renderWallet(wallet) {
  const box = document.getElementById('tabContent');
  if (!wallet.transactions.length) {
    box.innerHTML = `<div class="empty">No entries yet. Complete a task to start your ledger.</div>`;
    return;
  }
  box.innerHTML = `
    <div class="ledger-head"><span style="flex:1">Description</span><span style="width:90px; text-align:right;">Amount</span></div>
    ${wallet.transactions.map(t => `
      <div class="ledger-row">
        <div class="lc-desc">${t.reason}</div>
        <div class="lc-amt ${t.type}">${t.type === 'credit' ? '+' : '−'}₹${t.amount}</div>
      </div>
    `).join('')}
    <div class="closing"><span>Balance carried forward</span><span>₹${wallet.balance}</span></div>
  `;
}

function renderWithdraw(wallet) {
  const box = document.getElementById('tabContent');
  box.innerHTML = `
    <div class="entry-meta">Available to withdraw</div>
    <div class="balance" style="text-align:left; color: var(--credit); margin: 4px 0 0;">₹${wallet.balance}</div>
    <div class="slip">
      <label>UPI ID</label>
      <input id="upi" placeholder="name@upi" />
      <label>Amount (min ₹50)</label>
      <input id="amt" type="number" placeholder="0" />
      <button class="primary" onclick="submitWithdraw()">Submit slip</button>
    </div>
    <p class="msg" id="wdMsg"></p>
  `;
}

async function submitWithdraw() {
  const upiId = document.getElementById('upi').value.trim();
  const amount = Number(document.getElementById('amt').value);
  const r = await api('/withdraw', { method: 'POST', body: JSON.stringify({ upiId, amount }) });
  document.getElementById('wdMsg').innerText = r.error || 'Slip submitted — pending approval.';
  if (!r.error) render();
}

render();
</script>
</body>
</html>
